<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusAI - Student Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>🎓 CampusAI</h1>

        <p class="subtitle">Student Login</p>


        <form id="loginForm">

            <label for="registerNo">
                Register Number
            </label>

            <input
                type="text"
                id="registerNo"
                placeholder="Enter Register Number"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p id="message"></p>


        <a href="index.html" class="back">
            ← Back to Home
        </a>

    </div>


    <script>

        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();


            const registerNo =
                document.getElementById("registerNo").value.trim();

            const password =
                document.getElementById("password").value.trim();

            const message =
                document.getElementById("message");


            message.style.color = "#333";
            message.textContent = "Logging in...";


            try {

                const response = await fetch(
                    "http://localhost:5000/student-login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            register_no: registerNo,
                            password: password
                        })
                    }
                );


                const data = await response.json();


                if (data.success) {

                    // Save logged-in student's register number
                    localStorage.setItem(
                        "loggedInRegisterNo",
                        data.student.register_no
                    );


                    // Save student's name
                    localStorage.setItem(
                        "loggedInStudentName",
                        data.student.name
                    );


                    // Save student's class
                    localStorage.setItem(
                        "loggedInStudentClass",
                        data.student.class_name
                    );


                    message.style.color = "green";

                    message.textContent =
                        "Login successful!";


                    // Open student dashboard
                    setTimeout(function() {

                        window.location.href =
                            "student-dashboard.html";

                    }, 500);

                } else {

                    message.style.color = "red";

                    message.textContent =
                        data.message;

                }

            } catch (error) {

                console.error(error);

                message.style.color = "red";

                message.textContent =
                    "Cannot connect to CampusAI server.";

            }

        });

    </script>

</body>
</html>
