<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .login-box {
            width: 400px;

            background-color: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;

            color: #1e293b;

            margin-bottom: 10px;
        }

        .role-name {
            text-align: center;

            color: #2563eb;

            font-weight: bold;

            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #333;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        .login-btn {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background-color: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #1d4ed8;
        }

        .back-btn {
            width: 100%;

            padding: 12px;

            margin-top: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            background-color: white;

            color: #333;

            font-size: 15px;

            cursor: pointer;
        }

        .back-btn:hover {
            background-color: #f1f5f9;
        }

        #message {
            text-align: center;

            margin-top: 18px;

            font-weight: bold;
        }

    </style>

</head>


<body>


    <div class="login-box">

        <h1>
            Admin Login
        </h1>


        <div
            class="role-name"
            id="roleName"
        >
            Admin
        </div>


        <!-- Username -->

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
        >


        <!-- Password -->

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
        >


        <!-- Login -->

        <button
            class="login-btn"
            onclick="adminLogin()"
        >
            Login
        </button>


        <!-- Back -->

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Back
        </button>


        <div id="message"></div>

    </div>



    <script>


        /*
            Get selected role
            from admin-role.html
        */

        const role =
            localStorage.getItem("adminRole");


        /*
            Show selected role
        */

        const roleName =
            document.getElementById("roleName");


        if (role === "complaint") {

            roleName.innerText =
                "📝 Complaint Admin";

        }

        else if (role === "library") {

            roleName.innerText =
                "📚 Library Admin";

        }

        else if (role === "foodcourt") {

            roleName.innerText =
                "🍴 Food Court Admin";

        }

        else if (role === "advisor") {

            roleName.innerText =
                "👨‍🏫 Class Advisor";

        }

        else if (role === "events") {

            roleName.innerText =
                "📅 Events Admin";

        }

        else if (role === "announcement") {

            roleName.innerText =
                "📢 Announcement Admin";

        }

        else {

            roleName.innerText =
                "Admin";

        }



        /*
            Admin Login
        */

        function adminLogin() {

            const username =
                document.getElementById(
                    "username"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            const message =
                document.getElementById(
                    "message"
                );


            /*
                Common username/password
            */

            if (
                username === "admin" &&
                password === "1234"
            ) {

                message.style.color =
                    "green";

                message.innerHTML =
                    "✅ Login successful";


                /*
                    Go to correct dashboard
                */

                setTimeout(function() {


                    if (role === "complaint") {

                        window.location.href =
                            "complaint-admin-dashboard.html";

                    }

                    else if (role === "library") {

                        window.location.href =
                            "library-admin-dashboard.html";

                    }

                    else if (role === "foodcourt") {

                        window.location.href =
                            "foodcourt-admin-dashboard.html";

                    }

                    else if (role === "advisor") {

                        window.location.href =
                            "class-advisor-dashboard.html";

                    }

                    else if (role === "events") {

                        window.location.href =
                            "events-admin-dashboard.html";

                    }

                    else if (role === "announcement") {

                        window.location.href =
                            "announcement-admin-dashboard.html";

                    }

                    else {

                        window.location.href =
                            "admin-role.html";

                    }

                }, 500);

            }


            /*
                Invalid login
            */

            else {

                message.style.color =
                    "red";

                message.innerHTML =
                    "❌ Invalid username or password";

            }

        }



        /*
            Back to role selection
        */

        function goBack() {

            window.location.href =
                "admin-role.html";

        }

    </script>


</body>

</html>
