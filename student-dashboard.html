<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusAI Student Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f6fb;
    color: #172554;
}

.sidebar {
    width: 250px;
    height: 100vh;
    background: #172554;
    color: white;
    position: fixed;
    left: 0;
    top: 0;
    padding: 25px 16px;
    display: flex;
    flex-direction: column;
}

.logo {
    text-align: center;
    font-size: 27px;
    font-weight: bold;
    margin-bottom: 45px;
}

.sidebar button {
    width: 100%;
    border: none;
    background: transparent;
    color: white;
    text-align: left;
    padding: 16px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 8px;
    margin-bottom: 8px;
}

.sidebar button:hover {
    background: #29427e;
}

.sidebar .logout-btn {
    margin-top: auto;
    background: #dc2626;
    text-align: center;
}

.main {
    margin-left: 250px;
    padding: 30px;
}

.profile {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px #00000010;
    margin-bottom: 25px;
}

.profile h1 {
    font-size: 28px;
    margin-bottom: 12px;
}

.profile p {
    margin-top: 7px;
    font-size: 17px;
    color: #475569;
}

.chat-container {
    max-width: 1100px;
    height: 75vh;
    min-height: 500px;
    margin: auto;
    background: white;
    border-radius: 18px;
    box-shadow: 0 5px 20px #00000012;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.chat-header {
    background: #203f96;
    color: white;
    padding: 25px;
    text-align: center;
}

.chat-header h2 {
    font-size: 28px;
    margin-bottom: 8px;
}

.chat-header p {
    color: #dbeafe;
}

.chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
    background: #f8fafc;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.bot-message {
    background: #e0e7ff;
    color: #172554;
    padding: 18px;
    border-radius: 15px;
    max-width: 78%;
    align-self: flex-start;
    font-size: 17px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user-message {
    background: #2563eb;
    color: white;
    padding: 18px;
    border-radius: 15px;
    max-width: 78%;
    align-self: flex-end;
    font-size: 17px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.chat-input-area {
    display: flex;
    gap: 12px;
    padding: 18px;
    border-top: 1px solid #ddd;
    background: white;
}

.chat-input-area input {
    flex: 1;
    padding: 16px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 17px;
    outline: none;
}

.chat-input-area input:focus {
    border-color: #2563eb;
}

.chat-input-area button {
    padding: 15px 28px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
}

.chat-input-area button:hover {
    background: #1d4ed8;
}

.chat-input-area button:disabled {
    background: #94a3b8;
    cursor: not-allowed;
}

@media (max-width: 750px) {
    .sidebar {
        width: 75px;
        padding: 15px 5px;
    }

    .logo {
        font-size: 12px;
        margin-bottom: 20px;
    }

    .sidebar button {
        font-size: 12px;
        padding: 12px 4px;
        text-align: center;
    }

    .main {
        margin-left: 75px;
        padding: 12px;
    }

    .chat-container {
        height: 70vh;
        min-height: 400px;
    }

    .bot-message,
    .user-message {
        max-width: 95%;
        font-size: 15px;
    }

    .chat-input-area {
        padding: 10px;
    }

    .chat-input-area input {
        min-width: 0;
        font-size: 14px;
    }

    .chat-input-area button {
        padding: 12px;
        font-size: 14px;
    }
}
</style>

</head>

<body>

<div class="sidebar">
    <div class="logo">CampusAI</div>

```
<button onclick="goHome()">🏠 Dashboard</button>
<button onclick="goComplaint()">📝 Complaint Status</button>
<button onclick="goFoodCourt()">🍔 Food Court</button>
<button onclick="goLibrary()">📚 Library</button>
<button onclick="goEvents()">🎉 Events</button>
<button onclick="goAnnouncements()">📢 Announcements</button>

<button class="logout-btn" onclick="logout()">🚪 Logout</button>
```

</div>

<div class="main">

```
<div class="profile">
    <h1 id="welcomeName">Welcome Student</h1>
    <p>Register Number: <b id="registerNo"></b></p>
    <p>Class: <b id="studentClass"></b></p>
</div>

<div class="chat-container">

    <div class="chat-header">
        <h2>🤖 CampusAI Assistant</h2>
        <p>Ask anything about your campus...</p>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="bot-message">
            👋 Hello! I am CampusAI.

            You can ask me about your Internal Marks, attendance.
        </div>
    </div>

    <div class="chat-input-area">
        <input
            type="text"
            id="chatInput"
            placeholder="Ask anything about your campus..."
            autocomplete="off"
        >

        <button id="sendButton" onclick="askQuestion()">Send</button>
    </div>

</div>
```

</div>

<script>
const loggedInStudentName =
    localStorage.getItem("loggedInStudentName");

const loggedInRegisterNo =
    localStorage.getItem("loggedInRegisterNo");

const loggedInStudentClass =
    localStorage.getItem("loggedInStudentClass");

if (!loggedInRegisterNo) {
    alert("Please login first.");
    window.location.href = "login.html";
}

document.getElementById("welcomeName").innerText =
    "Welcome " + (loggedInStudentName || "Student");

document.getElementById("registerNo").innerText =
    loggedInRegisterNo || "";

document.getElementById("studentClass").innerText =
    loggedInStudentClass || "";

// Sidebar navigation

function goHome() {
    window.location.href = "student-dashboard.html";
}

function goComplaint() {
    window.location.href = "complaint.html";
}

function goFoodCourt() {
    window.location.href = "foodcourt.html";
}

function goLibrary() {
    window.location.href = "library.html";
}

function goEvents() {
    window.location.href = "events.html";
}

function goAnnouncements() {
    window.location.href = "announcements.html";
}

// Logout

function logout() {
    const confirmLogout =
        confirm("Are you sure you want to logout?");

    if (!confirmLogout) return;

    localStorage.removeItem("loggedInStudentName");
    localStorage.removeItem("loggedInRegisterNo");
    localStorage.removeItem("loggedInStudentClass");

    window.location.href = "login.html";
}

// Chatbot

async function askQuestion() {

    const input = document.getElementById("chatInput");
    const chatBox = document.getElementById("chatBox");
    const sendButton = document.getElementById("sendButton");

    const question = input.value.trim();

    if (question === "") {
        return;
    }

    const registerNo =
        localStorage.getItem("loggedInRegisterNo");

    if (!registerNo) {
        alert("Student login details not found. Please login again.");
        window.location.href = "login.html";
        return;
    }

    // Student message

    const userMessage = document.createElement("div");

    userMessage.className = "user-message";
    userMessage.innerText = question;

    chatBox.appendChild(userMessage);

    input.value = "";
    sendButton.disabled = true;

    // Bot message

    const botMessage = document.createElement("div");

    botMessage.className = "bot-message";
    botMessage.innerText = "Thinking...";

    chatBox.appendChild(botMessage);

    chatBox.scrollTop = chatBox.scrollHeight;

    try {

        const response = await fetch(
            "http://localhost:5000/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    register_no: registerNo,
                    question: question
                })
            }
        );

        const data = await response.json();

        console.log("CampusAI HTTP Status:", response.status);
        console.log("CampusAI Response:", data);

        if (!response.ok) {
            throw new Error(
                data.message ||
                data.error ||
                "Backend error: " + response.status
            );
        }

        const answer =
            data.answer ??
            data.reply ??
            data.message ??
            data.response;

        if (
            typeof answer === "string" &&
            answer.trim() !== ""
        ) {

            botMessage.innerText = answer;

        } else {

            botMessage.innerText =
                "CampusAI received an empty answer. Please check the /chat API in server.js.";

        }

    } catch (error) {

        console.error("CampusAI Chatbot Error:", error);

        botMessage.innerText =
            "Unable to connect to CampusAI. Please check whether the backend is running and try again.";

    } finally {

        sendButton.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
        input.focus();

    }
}

// Enter key support

document.getElementById("chatInput").addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Enter") {
            askQuestion();
        }
    }
);
</script>

</body>
</html>
