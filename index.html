<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusAI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;

            background: white;

            padding: 45px 35px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .logo {
            color: #667eea;

            font-size: 20px;

            font-weight: bold;

            letter-spacing: 3px;

            margin-bottom: 15px;
        }

        h1 {
            color: #4b3f72;

            font-size: 35px;

            margin-bottom: 12px;
        }

        .subtitle {
            color: #666;

            font-size: 18px;

            margin-bottom: 35px;
        }

        .role-container {
            display: flex;

            flex-direction: column;

            gap: 20px;
        }

        .role-button {
            width: 100%;

            padding: 18px;

            border: 2px solid #eeeeee;

            border-radius: 12px;

            background: white;

            color: #4b3f72;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .role-button:hover {
            background: #667eea;

            color: white;

            border-color: #667eea;

            transform: translateY(-3px);

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .icon {
            font-size: 22px;

            margin-right: 10px;
        }

        .footer {
            margin-top: 30px;

            color: #999;

            font-size: 13px;
        }

        @media (max-width: 600px) {

            .container {
                padding: 35px 20px;
            }

            h1 {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- CAMPUS AI -->

        <div class="logo">
            CAMPUS AI
        </div>


        <!-- WELCOME -->

        <h1>
            WELCOME TO CAMPUS AI
        </h1>


        <!-- CHOOSE ROLE -->

        <p class="subtitle">
            CHOOSE ROLE
        </p>


        <div class="role-container">


            <!-- STUDENT -->

            <button
                class="role-button"
                onclick="studentLogin()">

                <span class="icon">
                    🎓
                </span>

                STUDENT

            </button>


            <!-- ADMIN -->

            <button
                class="role-button"
                onclick="adminLogin()">

                <span class="icon">
                    👨‍💼
                </span>

                ADMIN

            </button>


        </div>


        <div class="footer">

            Semester 5 Project |
            CampusAI

        </div>


    </div>



    <script>


        // STUDENT BUTTON

        function studentLogin() {

            window.location.href =
                "login.html";

        }


        // ADMIN BUTTON

        function adminLogin() {

            window.location.href =
                "admin-role.html";

        }


    </script>


</body>

</html>
