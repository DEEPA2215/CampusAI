<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Food Court Admin Dashboard - CampusAI</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        h2 {
            color: #2c3e50;
        }

        .form-box {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 10px 16px;
            margin: 5px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1f2d3a;
        }

        .edit-btn {
            background-color: #2980b9;
        }

        .edit-btn:hover {
            background-color: #21618c;
        }

        .delete-btn {
            background-color: #c0392b;
        }

        .delete-btn:hover {
            background-color: #922b21;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 14px;
            text-align: center;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

        .no-data {
            color: #777;
            padding: 20px;
        }

    </style>

</head>


<body>


    <div class="header">

        <h1>CampusAI</h1>

        <p>Food Court Admin Dashboard</p>

    </div>


    <div class="container">


        <h2>Food Court Management</h2>


        <!-- Add / Edit Food -->

        <div class="form-box">

            <h3 id="formTitle">
                Add Food
            </h3>

            <input
                type="text"
                id="foodName"
                placeholder="Enter Available Food"
            >

            <input
                type="number"
                id="foodPrice"
                placeholder="Enter Price"
            >

            <input
                type="number"
                id="foodQuantity"
                placeholder="Enter No. of Food Available"
            >

            <br>

            <button
                id="saveButton"
                onclick="addFood()"
            >
                Add Food
            </button>

            <button
                id="cancelButton"
                onclick="cancelEdit()"
                style="display:none;"
            >
                Cancel
            </button>

        </div>


        <!-- Food List -->

        <h2>Food List</h2>


        <table>

            <thead>

                <tr>

                    <th>Available Food</th>

                    <th>Price</th>

                    <th>No. of Food Available</th>

                    <th>Actions</th>

                </tr>

            </thead>


            <tbody id="foodTable">

            </tbody>

        </table>


    </div>



    <script>

        const API_URL =
            "http://localhost:5000";


        let foods = [];

        let editingFoodId = null;



        // =====================================================
        // LOAD FOODS
        // =====================================================

        async function loadFoods() {

            const table =
                document.getElementById("foodTable");

            table.innerHTML = `

                <tr>

                    <td colspan="4">
                        Loading food items...
                    </td>

                </tr>

            `;


            try {

                const response =
                    await fetch(
                        `${API_URL}/foodcourt`
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.error ||
                        "Unable to load foods"
                    );

                }


                foods =
                    data.items || [];


                displayFoods();


            } catch (error) {

                console.error(
                    "Load food error:",
                    error
                );


                table.innerHTML = `

                    <tr>

                        <td
                            colspan="4"
                            class="no-data"
                        >
                            Unable to load food items.
                        </td>

                    </tr>

                `;

            }

        }



        // =====================================================
        // DISPLAY FOODS
        // =====================================================

        function displayFoods() {

            const table =
                document.getElementById("foodTable");


            table.innerHTML = "";


            if (foods.length === 0) {

                table.innerHTML = `

                    <tr>

                        <td
                            colspan="4"
                            class="no-data"
                        >
                            No items added
                        </td>

                    </tr>

                `;

                return;

            }


            foods.forEach(
                function(food) {

                    table.innerHTML += `

                        <tr>

                            <td>
                                ${food.name}
                            </td>

                            <td>
                                ₹${food.price}
                            </td>

                            <td>
                                ${food.quantity}
                            </td>

                            <td>

                                <button
                                    class="edit-btn"
                                    onclick="editFood(${food.id})"
                                >
                                    Edit
                                </button>

                                <button
                                    class="delete-btn"
                                    onclick="deleteFood(${food.id})"
                                >
                                    Delete
                                </button>

                            </td>

                        </tr>

                    `;

                }
            );

        }



        // =====================================================
        // ADD FOOD
        // =====================================================

        async function addFood() {

            const name =
                document
                    .getElementById("foodName")
                    .value
                    .trim();


            const price =
                document
                    .getElementById("foodPrice")
                    .value;


            const quantity =
                document
                    .getElementById("foodQuantity")
                    .value;


            if (
                name === "" ||
                price === "" ||
                quantity === ""
            ) {

                alert(
                    "Please fill all details"
                );

                return;

            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/foodcourt`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                name: name,

                                price: price,

                                quantity: quantity

                            })

                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.error ||
                        data.message ||
                        "Food could not be added"
                    );

                }


                alert(
                    "Food added successfully!"
                );


                clearForm();


                loadFoods();


            } catch (error) {

                console.error(
                    "Add food error:",
                    error
                );


                alert(
                    "Unable to add food."
                );

            }

        }



        // =====================================================
        // EDIT FOOD
        // =====================================================

        function editFood(id) {

            const food =
                foods.find(
                    item =>
                        Number(item.id) ===
                        Number(id)
                );


            if (!food) {

                alert(
                    "Food item not found."
                );

                return;

            }


            editingFoodId =
                id;


            document
                .getElementById("foodName")
                .value =
                    food.name;


            document
                .getElementById("foodPrice")
                .value =
                    food.price;


            document
                .getElementById("foodQuantity")
                .value =
                    food.quantity;


            document
                .getElementById("formTitle")
                .innerText =
                    "Edit Food";


            document
                .getElementById("saveButton")
                .innerText =
                    "Update Food";


            document
                .getElementById("saveButton")
                .onclick =
                    updateFood;


            document
                .getElementById("cancelButton")
                .style.display =
                    "inline-block";

        }



        // =====================================================
        // UPDATE FOOD
        // =====================================================

        async function updateFood() {

            const name =
                document
                    .getElementById("foodName")
                    .value
                    .trim();


            const price =
                document
                    .getElementById("foodPrice")
                    .value;


            const quantity =
                document
                    .getElementById("foodQuantity")
                    .value;


            if (
                name === "" ||
                price === "" ||
                quantity === ""
            ) {

                alert(
                    "Please fill all details"
                );

                return;

            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/foodcourt/${editingFoodId}`,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                name: name,

                                price: price,

                                quantity: quantity

                            })

                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.error ||
                        data.message ||
                        "Food could not be updated"
                    );

                }


                alert(
                    "Food updated successfully!"
                );


                cancelEdit();


                loadFoods();


            } catch (error) {

                console.error(
                    "Update food error:",
                    error
                );


                alert(
                    "Unable to update food."
                );

            }

        }



        // =====================================================
        // DELETE FOOD
        // =====================================================

        async function deleteFood(id) {

            const food =
                foods.find(
                    item =>
                        Number(item.id) ===
                        Number(id)
                );


            if (!food) {

                alert(
                    "Food item not found."
                );

                return;

            }


            const confirmDelete =
                confirm(
                    `Are you sure you want to delete "${food.name}"?`
                );


            if (!confirmDelete) {

                return;

            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/foodcourt/${id}`,
                        {
                            method: "DELETE"
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.error ||
                        data.message ||
                        "Food could not be deleted"
                    );

                }


                alert(
                    "Food deleted successfully!"
                );


                loadFoods();


            } catch (error) {

                console.error(
                    "Delete food error:",
                    error
                );


                alert(
                    "Unable to delete food."
                );

            }

        }



        // =====================================================
        // CANCEL EDIT
        // =====================================================

        function cancelEdit() {

            editingFoodId = null;


            clearForm();


            document
                .getElementById("formTitle")
                .innerText =
                    "Add Food";


            document
                .getElementById("saveButton")
                .innerText =
                    "Add Food";


            document
                .getElementById("saveButton")
                .onclick =
                    addFood;


            document
                .getElementById("cancelButton")
                .style.display =
                    "none";

        }



        // =====================================================
        // CLEAR FORM
        // =====================================================

        function clearForm() {

            document
                .getElementById("foodName")
                .value = "";


            document
                .getElementById("foodPrice")
                .value = "";


            document
                .getElementById("foodQuantity")
                .value = "";

        }



        // =====================================================
        // START
        // =====================================================

        loadFoods();

    </script>


</body>

</html>
