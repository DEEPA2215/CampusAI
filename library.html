<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Library - CampusAI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 230px;
            height: 100vh;
            background-color: #2c3e50;
            color: white;
            padding-top: 25px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            padding: 16px 25px;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        .sidebar a:hover {
            background-color: #1f2d3a;
        }

        .main {
            margin-left: 230px;
            padding: 30px;
        }

        h1 {
            color: #2c3e50;
        }

        /* Search */

        .search-box {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .search-box input {
            width: 75%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .search-box button {
            padding: 13px 20px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .search-box button:hover {
            background-color: #1f2d3a;
        }

        /* Table */

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 14px;
            text-align: center;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

        .no-data {
            color: #777;
            padding: 20px;
        }

    </style>

</head>


<body>


    <!-- Sidebar -->

    <div class="sidebar">

        <h2>CampusAI</h2>

        <a onclick="goHome()">
            🏠 Home
        </a>

        <a onclick="goComplaint()">
            📝 Complaint Status
        </a>

        <a onclick="goFoodCourt()">
            🍴 Food Court
        </a>

        <a onclick="goLibrary()">
            📚 Library
        </a>

    </div>


    <!-- Main -->

    <div class="main">

        <h1>📚 Library</h1>


        <!-- Search -->

        <div class="search-box">

            <input
                type="text"
                id="searchBook"
                placeholder="Search book..."
                onkeyup="searchBooks()"
            >

            <button onclick="searchBooks()">
                Search
            </button>

        </div>


        <!-- Books Table -->

        <table>

            <thead>

                <tr>

                    <th>Available Book</th>

                    <th>No. of Books</th>

                    <th>Status</th>

                </tr>

            </thead>

            <tbody id="bookTable">

            </tbody>

        </table>

    </div>


    <script>


        let books =
            JSON.parse(
                localStorage.getItem("libraryBooks")
            ) || [];


        function displayBooks(bookList) {

            const table =
                document.getElementById("bookTable");

            table.innerHTML = "";


            if (bookList.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="3" class="no-data">
                            No books added
                        </td>
                    </tr>
                `;

                return;
            }


            bookList.forEach(function(book) {

                table.innerHTML += `
                    <tr>
                        <td>${book.name}</td>
                        <td>${book.count}</td>
                        <td>${book.status}</td>
                    </tr>
                `;

            });

        }


        function searchBooks() {

            const searchText =
                document.getElementById("searchBook")
                .value
                .toLowerCase()
                .trim();


            const filteredBooks =
                books.filter(function(book) {

                    return book.name
                        .toLowerCase()
                        .includes(searchText);

                });


            displayBooks(filteredBooks);

        }


        function goHome() {
            window.location.href =
                "student-dashboard.html";
        }


        function goComplaint() {
            window.location.href =
                "complaint.html";
        }


        function goFoodCourt() {
            window.location.href =
                "foodcourt.html";
        }


        function goLibrary() {
            window.location.href =
                "library.html";
        }


        displayBooks(books);

    </script>

</body>

</html>
