<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Events Admin Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
        }

        /* Sidebar */

        .sidebar {
            width: 220px;
            height: 100vh;
            background-color: #1e293b;
            color: white;

            position: fixed;
            left: 0;
            top: 0;

            padding: 25px 15px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar button {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;

            border: none;
            border-radius: 6px;

            background-color: #334155;
            color: white;

            cursor: pointer;
            font-size: 15px;
            text-align: left;
        }

        .sidebar button:hover {
            background-color: #475569;
        }


        /* Main */

        .main {
            margin-left: 220px;
            padding: 30px;
        }

        .main h1 {
            color: #1e293b;
            margin-bottom: 25px;
        }


        /* Form */

        .form-box {
            background-color: white;

            padding: 25px;

            border-radius: 10px;

            margin-bottom: 30px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .form-box h2 {
            margin-bottom: 20px;
        }

        input,
        textarea {
            width: 100%;

            padding: 12px;

            margin-bottom: 15px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .add-btn {
            background-color: #2563eb;

            color: white;

            border: none;

            padding: 12px 20px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 15px;
        }

        .add-btn:hover {
            background-color: #1d4ed8;
        }


        /* Table */

        .table-box {
            background-color: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.1);

            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 1000px;
        }

        th,
        td {
            border: 1px solid #ddd;

            padding: 14px;

            text-align: center;
        }

        th {
            background-color: #1e293b;
            color: white;
        }


        /* Buttons */

        .edit-btn {
            background-color: #f59e0b;

            color: white;

            border: none;

            padding: 8px 12px;

            border-radius: 5px;

            cursor: pointer;
        }

        .delete-btn {
            background-color: #dc2626;

            color: white;

            border: none;

            padding: 8px 12px;

            border-radius: 5px;

            cursor: pointer;
        }

        .edit-btn:hover {
            background-color: #d97706;
        }

        .delete-btn:hover {
            background-color: #b91c1c;
        }

        .no-data {
            text-align: center;

            padding: 20px;

            color: #777;
        }

    </style>

</head>


<body>


    <!-- Sidebar -->

    <div class="sidebar">

        <h2>CampusAI</h2>

        <button onclick="goDashboard()">
            Dashboard
        </button>

        <button onclick="goLogout()">
            Logout
        </button>

    </div>


    <!-- Main -->

    <div class="main">

        <h1>
            Events Admin Dashboard
        </h1>


        <!-- Add / Update Event -->

        <div class="form-box">

            <h2 id="formTitle">
                Add Event
            </h2>


            <input
                type="text"
                id="eventName"
                placeholder="Enter Event Name"
            >


            <input
                type="date"
                id="eventDate"
            >


            <input
                type="text"
                id="eventVenue"
                placeholder="Enter Venue"
            >


            <textarea
                id="eventAbout"
                placeholder="Enter About Event"
            ></textarea>


            <input
                type="url"
                id="registrationLink"
                placeholder="Enter Registration Link"
            >


            <button
                class="add-btn"
                id="submitBtn"
                onclick="addEvent()"
            >
                Add Event
            </button>

        </div>


        <!-- Events Table -->

        <div class="table-box">

            <h2>
                Events
            </h2>


            <table>

                <thead>

                    <tr>

                        <th>
                            Events
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Venue
                        </th>

                        <th>
                            About Event
                        </th>

                        <th>
                            Registration Link
                        </th>

                        <th>
                            Update
                        </th>

                    </tr>

                </thead>


                <tbody id="eventTable">

                </tbody>

            </table>

        </div>

    </div>


    <script>


        /* Get events */

        let events =
            JSON.parse(
                localStorage.getItem("campusEvents")
            ) || [];


        /* Edit index */

        let editIndex = -1;



        /* Display events */

        function displayEvents() {

            const table =
                document.getElementById("eventTable");

            table.innerHTML = "";


            if (events.length === 0) {

                table.innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="no-data"
                        >
                            No events added
                        </td>

                    </tr>

                `;

                return;
            }


            events.forEach(function(event, index) {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${event.name}
                    </td>

                    <td>
                        ${event.date}
                    </td>

                    <td>
                        ${event.venue}
                    </td>

                    <td>
                        ${event.about}
                    </td>

                    <td>

                        ${
                            event.registrationLink
                            ?
                            `<a
                                href="${event.registrationLink}"
                                target="_blank"
                            >
                                Register Link
                            </a>`
                            :
                            "No Link"
                        }

                    </td>

                    <td>

                        <button
                            class="edit-btn"
                            onclick="editEvent(${index})"
                        >
                            Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteEvent(${index})"
                        >
                            Delete
                        </button>

                    </td>

                `;


                table.appendChild(row);

            });

        }



        /* Add Event */

        function addEvent() {

            const name =
                document.getElementById(
                    "eventName"
                ).value.trim();


            const date =
                document.getElementById(
                    "eventDate"
                ).value;


            const venue =
                document.getElementById(
                    "eventVenue"
                ).value.trim();


            const about =
                document.getElementById(
                    "eventAbout"
                ).value.trim();


            const registrationLink =
                document.getElementById(
                    "registrationLink"
                ).value.trim();


            if (
                name === "" ||
                date === "" ||
                venue === "" ||
                about === ""
            ) {

                alert(
                    "Please fill all required fields"
                );

                return;
            }


            const newEvent = {

                name: name,

                date: date,

                venue: venue,

                about: about,

                registrationLink:
                    registrationLink

            };


            /* Add */

            if (editIndex === -1) {

                events.push(newEvent);

                alert(
                    "Event added successfully!"
                );

            }


            /* Update */

            else {

                events[editIndex] =
                    newEvent;

                alert(
                    "Event updated successfully!"
                );

                editIndex = -1;

            }


            /* Save */

            localStorage.setItem(
                "campusEvents",
                JSON.stringify(events)
            );


            clearForm();

            displayEvents();

        }



        /* Edit Event */

        function editEvent(index) {

            const event =
                events[index];


            document.getElementById(
                "eventName"
            ).value = event.name;


            document.getElementById(
                "eventDate"
            ).value = event.date;


            document.getElementById(
                "eventVenue"
            ).value = event.venue;


            document.getElementById(
                "eventAbout"
            ).value = event.about;


            document.getElementById(
                "registrationLink"
            ).value =
                event.registrationLink || "";


            editIndex = index;


            document.getElementById(
                "formTitle"
            ).innerText =
                "Update Event";


            document.getElementById(
                "submitBtn"
            ).innerText =
                "Update Event";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }



        /* Delete Event */

        function deleteEvent(index) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this event?"
                );


            if (!confirmDelete) {
                return;
            }


            events.splice(index, 1);


            localStorage.setItem(
                "campusEvents",
                JSON.stringify(events)
            );


            displayEvents();


            alert(
                "Event deleted successfully!"
            );

        }



        /* Clear Form */

        function clearForm() {

            document.getElementById(
                "eventName"
            ).value = "";


            document.getElementById(
                "eventDate"
            ).value = "";


            document.getElementById(
                "eventVenue"
            ).value = "";


            document.getElementById(
                "eventAbout"
            ).value = "";


            document.getElementById(
                "registrationLink"
            ).value = "";


            document.getElementById(
                "formTitle"
            ).innerText =
                "Add Event";


            document.getElementById(
                "submitBtn"
            ).innerText =
                "Add Event";


            editIndex = -1;

        }



        /* Dashboard */

        function goDashboard() {

            window.location.href =
                "admin-role.html";

        }



        /* Logout */

        function goLogout() {

            localStorage.removeItem(
                "adminRole"
            );

            window.location.href =
                "index.html";

        }



        /* Load events */

        displayEvents();

    </script>

</body>

</html>
