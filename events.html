<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Events</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
        }

        .sidebar {
            width: 220px;
            height: 100vh;
            background-color: #1e293b;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            padding: 25px 15px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: none;
            border-radius: 6px;
            background-color: #334155;
            color: white;
            cursor: pointer;
            font-size: 15px;
            text-align: left;
        }

        .sidebar button:hover {
            background-color: #475569;
        }

        .main {
            margin-left: 220px;
            padding: 40px;
        }

        .main h1 {
            color: #1e293b;
            margin-bottom: 25px;
        }

        .event-box {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 14px;
            text-align: center;
        }

        th {
            background-color: #1e293b;
            color: white;
        }

        .register-btn {
            display: inline-block;
            padding: 8px 12px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .register-btn:hover {
            background-color: #1d4ed8;
        }

        .no-data {
            color: #777;
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->

    <div class="sidebar">

        <h2>CampusAI</h2>

        <button onclick="goHome()">
            🏠 Home
        </button>

        <button onclick="goComplaint()">
            📝 Complaint Status
        </button>

        <button onclick="goFoodCourt()">
            🍴 Food Court
        </button>

        <button onclick="goLibrary()">
            📚 Library
        </button>

        <button onclick="goEvents()">
            📅 Events
        </button>

        <button onclick="goAnnouncements()">
            📢 Announcements
        </button>

    </div>


    <!-- Main Content -->

    <div class="main">

        <h1>
            Campus Events
        </h1>

        <div class="event-box">

            <table>

                <thead>

                    <tr>
                        <th>Events</th>
                        <th>Date</th>
                        <th>Venue</th>
                        <th>About Event</th>
                        <th>Registration Link</th>
                    </tr>

                </thead>

                <tbody id="eventTable">

                </tbody>

            </table>

        </div>

    </div>


    <script>

        // Get events from localStorage

        let events =
            JSON.parse(
                localStorage.getItem("campusEvents")
            ) || [];


        // Display events

        function displayEvents() {

            const table =
                document.getElementById("eventTable");

            table.innerHTML = "";


            if (events.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="5" class="no-data">
                            No events added
                        </td>
                    </tr>
                `;

                return;
            }


            events.forEach(function(event) {

                const row =
                    document.createElement("tr");


                let registration =
                    event.registrationLink || "";


                let registrationButton = "";


                if (registration !== "") {

                    registrationButton = `
                        <a
                            href="${registration}"
                            target="_blank"
                            class="register-btn"
                        >
                            Register
                        </a>
                    `;

                } else {

                    registrationButton =
                        "No Link";

                }


                row.innerHTML = `

                    <td>
                        ${event.name}
                    </td>

                    <td>
                        ${event.date}
                    </td>

                    <td>
                        ${event.venue}
                    </td>

                    <td>
                        ${event.about}
                    </td>

                    <td>
                        ${registrationButton}
                    </td>

                `;


                table.appendChild(row);

            });

        }


        // Navigation

        function goHome() {
            window.location.href =
                "student-dashboard.html";
        }

        function goComplaint() {
            window.location.href =
                "complaint.html";
        }

        function goFoodCourt() {
            window.location.href =
                "foodcourt.html";
        }

        function goLibrary() {
            window.location.href =
                "library.html";
        }

        function goEvents() {
            window.location.href =
                "events.html";
        }

        function goAnnouncements() {
            window.location.href =
                "announcements.html";
        }


        // Load events

        displayEvents();

    </script>

</body>
</html>
