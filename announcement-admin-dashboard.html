<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Announcement Admin Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
        }

        .sidebar {
            width: 220px;
            height: 100vh;
            background-color: #1e293b;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            padding: 25px 15px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar button {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: none;
            border-radius: 6px;
            background-color: #334155;
            color: white;
            cursor: pointer;
            font-size: 15px;
            text-align: left;
        }

        .sidebar button:hover {
            background-color: #475569;
        }

        .main {
            margin-left: 220px;
            padding: 30px;
        }

        .main h1 {
            color: #1e293b;
            margin-bottom: 25px;
        }

        .form-box {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .form-box h2 {
            margin-bottom: 20px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .add-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-btn:hover {
            background-color: #1d4ed8;
        }

        .table-box {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 14px;
            text-align: center;
        }

        th {
            background-color: #1e293b;
            color: white;
        }

        .edit-btn {
            background-color: #f59e0b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        .delete-btn {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .edit-btn:hover {
            background-color: #d97706;
        }

        .delete-btn:hover {
            background-color: #b91c1c;
        }

        .no-data {
            text-align: center;
            padding: 20px;
            color: #777;
        }

    </style>

</head>


<body>


    <!-- Sidebar -->

    <div class="sidebar">

        <h2>CampusAI</h2>

        <button onclick="goDashboard()">
            Dashboard
        </button>

        <button onclick="goLogout()">
            Logout
        </button>

    </div>


    <!-- Main Content -->

    <div class="main">

        <h1>
            Announcement Admin Dashboard
        </h1>


        <!-- Add / Update Form -->

        <div class="form-box">

            <h2 id="formTitle">
                Add Announcement
            </h2>


            <textarea
                id="announcementText"
                placeholder="Enter Announcement"
            ></textarea>


            <input
                type="date"
                id="announcementDate"
            >


            <button
                class="add-btn"
                id="submitBtn"
                onclick="addAnnouncement()"
            >
                Add Announcement
            </button>

        </div>


        <!-- Announcement Table -->

        <div class="table-box">

            <h2>
                Announcements
            </h2>


            <table>

                <thead>

                    <tr>

                        <th>
                            Announcement
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Update
                        </th>

                    </tr>

                </thead>


                <tbody id="announcementTable">

                </tbody>

            </table>

        </div>

    </div>


    <script>


        /* Get announcements */

        let announcements =
            JSON.parse(
                localStorage.getItem("campusAnnouncements")
            ) || [];


        /* Edit index */

        let editIndex = -1;



        /* Display announcements */

        function displayAnnouncements() {

            const table =
                document.getElementById(
                    "announcementTable"
                );

            table.innerHTML = "";


            if (announcements.length === 0) {

                table.innerHTML = `

                    <tr>

                        <td
                            colspan="3"
                            class="no-data"
                        >
                            No announcements added
                        </td>

                    </tr>

                `;

                return;
            }


            announcements.forEach(
                function(announcement, index) {

                    const row =
                        document.createElement("tr");


                    row.innerHTML = `

                        <td>
                            ${announcement.text}
                        </td>

                        <td>
                            ${announcement.date}
                        </td>

                        <td>

                            <button
                                class="edit-btn"
                                onclick="editAnnouncement(${index})"
                            >
                                Edit
                            </button>


                            <button
                                class="delete-btn"
                                onclick="deleteAnnouncement(${index})"
                            >
                                Delete
                            </button>

                        </td>

                    `;


                    table.appendChild(row);

                }
            );

        }



        /* Add Announcement */

        function addAnnouncement() {

            const text =
                document.getElementById(
                    "announcementText"
                ).value.trim();


            const date =
                document.getElementById(
                    "announcementDate"
                ).value;


            if (text === "" || date === "") {

                alert(
                    "Please fill all fields"
                );

                return;
            }


            const newAnnouncement = {

                text: text,

                date: date

            };


            /* Add */

            if (editIndex === -1) {

                announcements.push(
                    newAnnouncement
                );

                alert(
                    "Announcement added successfully!"
                );

            }


            /* Update */

            else {

                announcements[editIndex] =
                    newAnnouncement;

                alert(
                    "Announcement updated successfully!"
                );

                editIndex = -1;

            }


            /* Save */

            localStorage.setItem(
                "campusAnnouncements",
                JSON.stringify(announcements)
            );


            clearForm();

            displayAnnouncements();

        }



        /* Edit Announcement */

        function editAnnouncement(index) {

            const announcement =
                announcements[index];


            document.getElementById(
                "announcementText"
            ).value =
                announcement.text;


            document.getElementById(
                "announcementDate"
            ).value =
                announcement.date;


            editIndex = index;


            document.getElementById(
                "formTitle"
            ).innerText =
                "Update Announcement";


            document.getElementById(
                "submitBtn"
            ).innerText =
                "Update Announcement";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }



        /* Delete Announcement */

        function deleteAnnouncement(index) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this announcement?"
                );


            if (!confirmDelete) {
                return;
            }


            announcements.splice(index, 1);


            localStorage.setItem(
                "campusAnnouncements",
                JSON.stringify(announcements)
            );


            displayAnnouncements();


            alert(
                "Announcement deleted successfully!"
            );

        }



        /* Clear Form */

        function clearForm() {

            document.getElementById(
                "announcementText"
            ).value = "";


            document.getElementById(
                "announcementDate"
            ).value = "";


            document.getElementById(
                "formTitle"
            ).innerText =
                "Add Announcement";


            document.getElementById(
                "submitBtn"
            ).innerText =
                "Add Announcement";


            editIndex = -1;

        }



        /* Dashboard */

        function goDashboard() {

            window.location.href =
                "admin-role.html";

        }



        /* Logout */

        function goLogout() {

            localStorage.removeItem(
                "adminRole"
            );

            window.location.href =
                "index.html";

        }



        /* Load */

        displayAnnouncements();

    </script>

</body>

</html>
